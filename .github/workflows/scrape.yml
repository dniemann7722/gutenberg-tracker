name: Scrape Gutenberg Top 100

on:
  schedule:
    # Weekly: every Monday at 09:00 UTC - scrapes the "last 7 days" list.
    # A 7-day window sampled every 7 days has almost no overlap with the
    # previous sample, so this is where most of the useful signal is.
    - cron: "0 9 * * 1"
    # Monthly: the 1st of the month at 09:00 UTC - scrapes the "last 30
    # days" list. Sampled more often than this it would mostly just
    # re-report days already captured by the previous sample.
    - cron: "0 9 1 * *"
  # Lets you trigger a run manually from the Actions tab, choosing which
  # window(s) to scrape - handy for testing or backfilling.
  workflow_dispatch:
    inputs:
      windows:
        description: "Which window(s) to scrape"
        type: choice
        default: "books-last7"
        options:
          - books-last7
          - books-last30
          - "books-last7,books-last30"

# Grants the job permission to push the updated CSV back to the repo.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine which window(s) to scrape
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "windows=${{ github.event.inputs.windows }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 1 * *" ]; then
            echo "windows=books-last30" >> "$GITHUB_OUTPUT"
          else
            echo "windows=books-last7" >> "$GITHUB_OUTPUT"
          fi

      - name: Run scraper
        run: python scrape.py --windows "${{ steps.pick.outputs.windows }}"

      - name: Commit and push updated data
        run: |
          git config user.name "gutenberg-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/top100_books.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add $(date -u +%Y-%m-%d) Top 100 scrape (${{ steps.pick.outputs.windows }})"
            git push
          fi
